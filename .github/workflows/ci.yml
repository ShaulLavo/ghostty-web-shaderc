name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run typecheck:showcase
      - run: bun run showcase:build
      - run: bun run test:package
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun run test:showcase
