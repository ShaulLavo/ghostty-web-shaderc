<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101315" />
    <meta
      name="description"
      content="Runtime Ghostty shaders. Source, generated code, and a live terminal."
    />
    <title>ghostty-web-shaderc</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23101315'/%3E%3Cpath d='m10 12 8 8-8 8m11 0h9' fill='none' stroke='%239ae4c5' stroke-width='3'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app" data-state="initializing">
      <header class="toolbar">
        <a
          class="brand"
          href="https://github.com/ShaulLavo/ghostty-web-shaderc"
          target="_blank"
          rel="noreferrer"
          aria-label="ghostty-web-shaderc source"
          title="ghostty-web-shaderc on GitHub"
        >
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m4 5 7 7-7 7m10 0h7" />
          </svg>
          <span>ghostty-web-shaderc</span>
        </a>
        <select id="example-select" aria-label="Choose a shader example"></select>
        <span
          id="compile-indicator"
          class="compile-indicator"
          data-state="compiling"
          title="Compiling shader"
          aria-hidden="true"
        ></span>
        <div class="preview-controls">
          <button
            id="pause-button"
            class="icon-button"
            type="button"
            aria-label="Pause animation"
            title="Pause animation"
            aria-pressed="false"
            disabled
          >
            <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M4 3h3v10H4zm5 0h3v10H9z" />
            </svg>
          </button>
          <button
            id="effect-button"
            class="icon-button effect-button"
            type="button"
            aria-label="Turn shader off"
            title="Turn shader off"
            aria-pressed="true"
            disabled
          >
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path
                d="m9 3 1.7 4.3L15 9l-4.3 1.7L9 15l-1.7-4.3L3 9l4.3-1.7L9 3ZM16 2v4m-2-2h4m-1 10v4m-2-2h4"
              />
            </svg>
          </button>
        </div>
        <span id="backend-badge" class="backend-label"></span>
      </header>
      <main class="workspace" aria-label="Shader example">
        <section class="preview-pane" aria-label="Live Ghostty demo session">
          <div
            id="terminal-preview"
            class="terminal-preview"
            aria-label="Ghostty terminal with the selected shader"
          ></div>
          <div id="preview-message" class="preview-message" role="status">Loading…</div>
          <div id="example-credit" class="example-credit"></div>
        </section>
        <section class="code-pane" aria-label="Example source and compiled output">
          <div class="file-toolbar">
            <nav id="file-tabs" class="file-tabs" aria-label="Example files" role="tablist"></nav>
            <button
              id="copy-button"
              class="icon-button copy-button"
              type="button"
              aria-label="Copy code"
              title="Copy code"
              disabled
            >
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M6 5V2.5h7.5V10H11" />
                <rect x="2.5" y="5.5" width="8" height="8" rx="1" />
              </svg>
            </button>
          </div>
          <div class="code-scroll" id="code-scroll" tabindex="0" aria-label="Read-only source code">
            <pre class="code-gutter" id="code-gutter" aria-hidden="true"></pre>
            <pre
              class="code-content"
              data-code
            ><code id="source-code" role="tabpanel" aria-label="index.ts"></code></pre>
          </div>
          <div class="code-footer" id="code-footer">
            <span id="compile-status" role="status" aria-live="polite">Compiling…</span>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
