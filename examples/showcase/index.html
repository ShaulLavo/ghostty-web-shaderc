<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0d0e" />
    <meta
      name="description"
      content="Runtime Ghostty shaders compiled to WGSL and GLSL in the browser."
    />
    <title>ghostty-web-shaderc</title>
  </head>
  <body>
    <div id="app" data-state="initializing">
      <header class="toolbar">
        <select id="example-select" aria-label="Choose a shader example"></select>
      </header>
      <main class="workspace" aria-label="Shader example">
        <section class="preview-pane" aria-label="Live Ghostty demo session">
          <div
            id="terminal-preview"
            class="terminal-preview"
            aria-label="Ghostty terminal with the selected shader"
          ></div>
          <div id="preview-message" class="preview-message" role="status">Loading…</div>
        </section>
        <section class="code-pane" aria-label="Example source and compiled output">
          <nav id="file-tabs" class="file-tabs" aria-label="Example files" role="tablist"></nav>
          <div class="code-scroll" id="code-scroll" tabindex="0" aria-label="Read-only source code">
            <pre class="code-gutter" id="code-gutter" aria-hidden="true"></pre>
            <pre
              class="code-content"
              data-code
            ><code id="source-code" role="tabpanel" aria-label="index.ts"></code></pre>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
